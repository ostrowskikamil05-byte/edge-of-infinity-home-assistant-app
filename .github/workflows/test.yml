name: Python Syntax Check

on:
  push:
  pull_request:

jobs:
  container-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build native-only app image
        run: docker build --tag edge-native-smoke edge-of-infinity
      - name: Test real startup, migration and installed engines
        run: bash tests/container_smoke.sh edge-native-smoke

  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python files
        run: python -m compileall .

      - name: Validate JSON manifests
        run: |
          python -m json.tool edge-of-infinity/rootfs/usr/share/edge-of-infinity/custom_components/edge/manifest.json > /dev/null

      - name: Check add-on runner syntax
        run: bash -n edge-of-infinity/rootfs/usr/bin/edge-app-run

      - name: Run regression tests
        run: python -m unittest discover -s tests

  remote-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --prefix "${RUNNER_TEMP}/edge-browser-tests" --no-save playwright@1.62.1
          "${RUNNER_TEMP}/edge-browser-tests/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Test native remote routing and browser requirements
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          node tests/browser/remote_live.cjs
          node tests/browser/edge_rtc_support.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/panel_session.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/panel_session.cjs
          node tests/edge_rtc_pacing.cjs
          node tests/edge_i18n.cjs
          node tests/edge_log_view.cjs
      - name: Install fixture media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test continuous live audio
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          node tests/edge_rtc_audio.cjs
          node tests/edge_media_errors.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/edge_rtc_audio.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/edge_rtc_audio.cjs
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: edge-of-infinity/edge-rtc/go.sum
      - name: Build archive fixture core
        run: go -C edge-of-infinity/edge-rtc build -o "${RUNNER_TEMP}/edge-rtc-archive" .
      - name: Test detection settings, history and NVR seeking
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          EDGE_TEST_DETECTION_FIXTURE=1 EDGE_TEST_ARCHIVE_RTC_BINARY="${RUNNER_TEMP}/edge-rtc-archive" python tests/browser/fixture_server.py > "${RUNNER_TEMP}/detection-ui.log" 2>&1 &
          edge_fixture_pid=$!
          trap 'kill "${edge_fixture_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 20
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18088/api/version', timeout=1).close()
                  break
              except OSError:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(.1)
          PY
          node tests/browser/detection_zones.cjs
          node tests/browser/detection_ui.cjs
          node tests/browser/nvr_navigation.cjs
          node tests/browser/recording_storage.cjs
          node tests/browser/nvr_backpressure.cjs
          node tests/browser/ui_dashboard.cjs
          node tests/browser/camera_settings.cjs
          node tests/browser/settings_save.cjs
          node tests/browser/brand_assets.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/interface_languages.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/interface_languages.cjs
      - name: Test native phone recording decoders and camera switching
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          EDGE_TEST_DETECTION_FIXTURE=1 EDGE_TEST_MULTI_CAMERA=1 EDGE_TEST_RECORDING_DURATION=24 EDGE_TEST_ARCHIVE_RTC_BINARY="${RUNNER_TEMP}/edge-rtc-archive" EDGE_NVR_TEST_PORT=18091 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/phone-fixture.json" python tests/browser/fixture_server.py > "${RUNNER_TEMP}/phone-ui.log" 2>&1 &
          edge_phone_fixture_pid=$!
          trap 'kill "${edge_phone_fixture_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 30
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18091/api/version', timeout=1).close()
                  break
              except OSError:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(.1)
          PY
          EDGE_TEST_BROWSER=webkit node tests/browser/device_diagnostics.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/device_diagnostics.cjs
          pip install aiohttp==3.14.4
          EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/phone-fixture.json" EDGE_NVR_TEST_URL=http://127.0.0.1:18091 EDGE_HA_BRIDGE_PORT=18191 python tests/browser/ha_bridge_fixture.py > "${RUNNER_TEMP}/ha-bridge.log" 2>&1 &
          edge_bridge_pid=$!
          trap 'kill "${edge_phone_fixture_pid}" "${edge_bridge_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline = time.monotonic() + 20
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18191/', timeout=1).close()
                  break
              except OSError:
                  if time.monotonic() > deadline:
                      raise
                  time.sleep(.1)
          PY
          EDGE_HA_BRIDGE_URL=http://127.0.0.1:18191 EDGE_TEST_BROWSER=chromium node tests/browser/edge_dashboard_cards.cjs
          EDGE_HA_BRIDGE_URL=http://127.0.0.1:18191 EDGE_TEST_BROWSER=webkit node tests/browser/edge_dashboard_cards.cjs
          EDGE_NVR_TEST_URL=http://127.0.0.1:18091 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/phone-fixture.json" EDGE_HA_BRIDGE_URL=http://127.0.0.1:18191 node tests/browser/local_https.cjs
          EDGE_NVR_TEST_URL=http://127.0.0.1:18091 EDGE_TEST_BROWSER=chromium node tests/browser/nvr_native_interactions.cjs
          EDGE_NVR_TEST_URL=http://127.0.0.1:18091 EDGE_TEST_BROWSER=webkit node tests/browser/nvr_native_interactions.cjs

      - name: Test cold phone archive with twelve thousand saved files
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          EDGE_TEST_DETECTION_FIXTURE=1 EDGE_TEST_ARCHIVE_FILES=12000 EDGE_TEST_ARCHIVE_RTC_BINARY="${RUNNER_TEMP}/edge-rtc-archive" EDGE_NVR_TEST_PORT=18092 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/archive-fixture.json" python tests/browser/fixture_server.py > "${RUNNER_TEMP}/archive-ui.log" 2>&1 &
          edge_archive_fixture_pid=$!
          trap 'kill "${edge_archive_fixture_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline=time.monotonic()+30
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18092/api/version',timeout=1).close()
                  break
              except OSError:
                  if time.monotonic()>deadline:raise
                  time.sleep(.1)
          PY
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_archive_start.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_archive_start.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_gallery_cache.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_gallery_cache.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/logs_organized.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/logs_organized.cjs

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: edge-of-infinity/edge-rtc/go.sum
      - name: Test indexed EdgeRTC DVR, downloads and unsupported device handling
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          go -C edge-of-infinity/edge-rtc build -o "${RUNNER_TEMP}/edge-rtc-archive" .
          EDGE_TEST_DETECTION_FIXTURE=1 EDGE_TEST_MULTI_CAMERA=1 EDGE_TEST_RECORDING_DURATION=24 EDGE_TEST_RECORDING_LONG_GOP=1 EDGE_TEST_ARCHIVE_RTC_BINARY="${RUNNER_TEMP}/edge-rtc-archive" EDGE_NVR_TEST_PORT=18095 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/archive-rtc-fixture.json" python tests/browser/fixture_server.py > "${RUNNER_TEMP}/archive-rtc.log" 2>&1 &
          edge_archive_pid=$!
          trap 'kill "${edge_archive_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline=time.monotonic()+60
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18095/api/version',timeout=1).close()
                  break
              except OSError:
                  if time.monotonic()>deadline:raise
                  time.sleep(.1)
          PY
          export EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/archive-rtc-fixture.json"
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_edge_dvr.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_edge_dvr.cjs
          EDGE_TEST_BROWSER=webkit EDGE_TEST_DVR_CAMERA=0 node tests/browser/nvr_edge_dvr.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_dvr_fallback.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_dvr_fallback.cjs
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_dvr_latency.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_dvr_latency.cjs
      - name: Test original 4K frames through EdgeRTC DVR
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          EDGE_TEST_MULTI_CAMERA=1 EDGE_TEST_RECORDING_DURATION=24 EDGE_TEST_RECORDING_4K=1 EDGE_TEST_ARCHIVE_RTC_BINARY="${RUNNER_TEMP}/edge-rtc-archive" EDGE_NVR_TEST_PORT=18096 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/archive-rtc-4k.json" python tests/browser/fixture_server.py > "${RUNNER_TEMP}/archive-rtc-4k.log" 2>&1 &
          edge_archive_4k_pid=$!
          trap 'kill "${edge_archive_4k_pid}" || true' EXIT
          python - <<'PY'
          import time, urllib.request
          deadline=time.monotonic()+120
          while True:
              try:
                  urllib.request.urlopen('http://127.0.0.1:18096/api/version',timeout=1).close()
                  break
              except OSError:
                  if time.monotonic()>deadline:raise
                  time.sleep(.1)
          PY
          export EDGE_NVR_TEST_URL=http://127.0.0.1:18096 EDGE_NVR_FIXTURE_INFO="${RUNNER_TEMP}/archive-rtc-4k.json" EDGE_TEST_DVR_CAMERA=0 EDGE_TEST_DVR_WIDTH=3840 EDGE_TEST_DVR_HEIGHT=2160
          EDGE_TEST_BROWSER=webkit node tests/browser/nvr_edge_dvr.cjs
          EDGE_TEST_BROWSER=chromium node tests/browser/nvr_edge_dvr.cjs
      - name: Test native long-GOP cached startup with actual WebCodecs
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          export EDGE_RTC_TEST_BINARY="${RUNNER_TEMP}/edge-rtc-long-gop" EDGE_RTC_TEST_FPS=20 EDGE_RTC_TEST_GOP_SECONDS=24
          pip install aiohttp==3.14.4
          go -C edge-of-infinity/edge-rtc test -c -o "${EDGE_RTC_TEST_BINARY}" .
          python tests/run_edge_rtc_bootstrap.py
      - name: Test cellular Live on Android and iPhone
        run: |
          export NODE_PATH="${RUNNER_TEMP}/edge-browser-tests/node_modules"
          export EDGE_RTC_TEST_BINARY="${RUNNER_TEMP}/edge-rtc-long-gop"
          python tests/run_edge_rtc_cellular.py
          python tests/run_edge_media_sessions.py

  detection-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: edge-of-infinity/edge-rtc/go.sum
      - name: Install inference and media test dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg
          pip install opencv-python-headless==4.12.0.88 aiohttp==3.14.4
      - name: Fetch and verify public model/test fixture
        run: |
          python - <<'PY'
          import hashlib, os, pathlib, urllib.request
          folder = pathlib.Path(os.environ['RUNNER_TEMP'])
          files = {
              'nanodet.onnx': 'https://media.githubusercontent.com/media/opencv/opencv_zoo/48b10fa505aeb51fbd127fc60a5c660040e823b7/models/object_detection_nanodet/object_detection_nanodet_2022nov.onnx',
              'test-vehicle.png': 'https://raw.githubusercontent.com/opencv/opencv_extra/4.x/testdata/dnn/dog416.png',
          }
          for name, url in files.items():
              (folder / name).write_bytes(urllib.request.urlopen(url, timeout=30).read())
          assert hashlib.sha256((folder / 'nanodet.onnx').read_bytes()).hexdigest() == '4b82da9944b88577175ee23a459dce2e26e6e4be573def65b1055dc2d9720186'
          PY
      - name: Test actual model and HEVC shared-source pipeline
        run: |
          export EDGE_TEST_MODEL="${RUNNER_TEMP}/nanodet.onnx" EDGE_TEST_IMAGE="${RUNNER_TEMP}/test-vehicle.png" EDGE_DETECTION_MODEL="${RUNNER_TEMP}/nanodet.onnx" EDGE_RTC_TEST_BINARY="${RUNNER_TEMP}/edge-rtc-fixture"
          python -m unittest discover -s tests -p test_detection.py
          python -m unittest discover -s tests -p test_detection_zones.py
          python -m unittest discover -s tests -p test_detection_capture.py
          python -m unittest discover -s tests -p test_alert_media.py
          python -m unittest discover -s tests -p test_recording_compat.py
          go -C edge-of-infinity/edge-rtc test -c -o "${EDGE_RTC_TEST_BINARY}" .
          EDGE_RTC_TEST_NO_SDP_PARAMS=1 python tests/run_detection_media.py


  edge-rtc:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edge-of-infinity/edge-rtc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: edge-of-infinity/edge-rtc/go.sum
      - name: Test single source, native frames, microphone and serial reload
        run: go test -race ./...
      - name: Build amd64
        run: CGO_ENABLED=0 GOARCH=amd64 go build -o /tmp/edge-rtc-amd64 .
      - name: Build arm64
        run: CGO_ENABLED=0 GOARCH=arm64 go build -o /tmp/edge-rtc-arm64 .
