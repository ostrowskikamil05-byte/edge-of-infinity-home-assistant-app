name: Edge of Infinity
version: "0.17.2"
slug: edge_of_infinity
description: Local live and NVR core for Hikvision, Uniview, Reolink and ONVIF/RTSP cameras
url: https://github.com/ostrowskikamil05-byte/edge-of-infinity-home-assistant-app
arch:
  - amd64
  - aarch64
startup: application
boot: auto
stage: experimental
init: false
video: true
hassio_api: true
hassio_role: default
ingress: true
ingress_port: 8088
ingress_entry: /
ingress_stream: true
panel_icon: mdi:cctv
panel_title: Edge Infinity
panel_admin: true
watchdog: http://[HOST]:[PORT:8088]/health
webui: http://[HOST]:[PORT:8088]/
ports:
  8088/tcp: 8088
  8556/tcp: null
  9997/tcp: null
  8443/tcp: null
ports_description:
  8443/tcp: Optional local HTTPS gateway for Home Assistant; enable and trust its certificate first
  8088/tcp: Edge Core API and web interface
  8556/tcp: Shared core RTSP feed, host exposure disabled by default
  9997/tcp: Private streaming core API, host exposure disabled by default
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: app_config
    read_only: false
    path: /config
  - type: media
    read_only: false
    path: /media
options:
  log_level: info
  api_port: 8088
  recordings_dir: /media/edge-of-infinity/recordings
  database_path: /homeassistant/edge/edge.db
  retention_days: 14
  install_custom_component: true
  sync_addon_options: false
  edge_rtc_rtsp_port: 8556
  edge_rtc_api_port: 9997
  cameras: []
  camera_events_enabled: false
  local_detection_enabled: false
  detection_fps: 1
  detection_decoder: auto
  detection_confidence: 0.45
  detection_animal_confidence: 0.35
  detection_hold_seconds: 10
  detection_person_enabled: true
  detection_animal_enabled: true
  detection_vehicle_enabled: true
  detection_alert_media_mb: 256
  detection_pre_seconds: 5
  detection_post_seconds: 15
  detection_notifications_enabled: false
  detection_notify_service: ""
  detection_notify_cooldown: 30
  detection_notify_path: ""
  hikvision_1_enabled: false
  hikvision_1_name: Hikvision 1
  hikvision_1_host: ""
  hikvision_1_username: admin
  hikvision_1_password: ""
  hikvision_1_camera_number: "1"
  hikvision_1_access_protocol: rtsp
  hikvision_1_rtsp_transport: tcp
  hikvision_1_rtsp_main: ""
  hikvision_1_rtsp_sub: ""
  hikvision_1_onvif_url: ""
  hikvision_1_isapi_base_url: ""
  hikvision_1_record: true
  hikvision_1_low_latency: true
  hikvision_1_snapshot_stream: sub
  hikvision_1_live_stream: sub
  hikvision_1_record_stream: main
  hikvision_2_enabled: false
  hikvision_2_name: Hikvision 2
  hikvision_2_host: ""
  hikvision_2_username: admin
  hikvision_2_password: ""
  hikvision_2_camera_number: "2"
  hikvision_2_access_protocol: rtsp
  hikvision_2_rtsp_transport: tcp
  hikvision_2_rtsp_main: ""
  hikvision_2_rtsp_sub: ""
  hikvision_2_onvif_url: ""
  hikvision_2_isapi_base_url: ""
  hikvision_2_record: true
  hikvision_2_low_latency: true
  hikvision_2_snapshot_stream: sub
  hikvision_2_live_stream: sub
  hikvision_2_record_stream: main
schema:
  cameras:
    - id: str
      name: str?
      vendor: list(hikvision|dahua|uniview|reolink|axis|hanwha|amcrest|foscam|tapo|vigi|bosch|vivotek|sony|onvif|rtsp)
      host: str?
      username: str?
      password: password?
      rtsp_main: str?
      rtsp_sub: str?
      camera_number: str?
      access_protocol: str?
      rtsp_transport: str?
      onvif_url: str?
      isapi_base_url: str?
      enabled: bool
      manufacturer: str?
      model: str?
      firmware: str?
      events_enabled: bool?
      local_detection_enabled: bool?
      detection_zone_enabled: bool?
      detection_zone_left: float(0,1)?
      detection_zone_top: float(0,1)?
      detection_zone_right: float(0,1)?
      detection_zone_bottom: float(0,1)?
      record: bool
      low_latency: bool
      snapshot_stream: str?
      live_stream: str?
      tile_stream: str?
      record_stream: str?
  log_level: list(trace|debug|info|notice|warning|error|fatal)
  api_port: port
  recordings_dir: str
  database_path: str
  retention_days: int(1,365)
  install_custom_component: bool
  sync_addon_options: bool
  edge_rtc_rtsp_port: port
  edge_rtc_api_port: port
  camera_events_enabled: bool?
  local_detection_enabled: bool?
  detection_fps: float(0.2,3)?
  detection_decoder: list(auto|cpu|keyframes)?
  detection_confidence: float(0.1,0.95)?
  detection_animal_confidence: float(0.1,0.95)?
  detection_hold_seconds: int(1,120)?
  detection_person_enabled: bool?
  detection_animal_enabled: bool?
  detection_vehicle_enabled: bool?
  detection_alert_media_mb: int(32,4096)?
  detection_pre_seconds: int(0,10)?
  detection_post_seconds: int(5,60)?
  detection_notifications_enabled: bool?
  detection_notify_service: str?
  detection_notify_cooldown: int(5,3600)?
  detection_notify_path: str?
  hikvision_1_enabled: bool
  hikvision_1_name: str?
  hikvision_1_host: str?
  hikvision_1_username: str?
  hikvision_1_password: password?
  hikvision_1_camera_number: str?
  hikvision_1_access_protocol: list(rtsp|isapi|onvif|unicast|multicast)
  hikvision_1_rtsp_transport: list(tcp|udp|auto)
  hikvision_1_rtsp_main: str?
  hikvision_1_rtsp_sub: str?
  hikvision_1_onvif_url: str?
  hikvision_1_isapi_base_url: str?
  hikvision_1_record: bool
  hikvision_1_low_latency: bool
  hikvision_1_snapshot_stream: list(sub|main)
  hikvision_1_live_stream: list(sub|main)
  hikvision_1_record_stream: list(main|sub)
  hikvision_2_enabled: bool
  hikvision_2_name: str?
  hikvision_2_host: str?
  hikvision_2_username: str?
  hikvision_2_password: password?
  hikvision_2_camera_number: str?
  hikvision_2_access_protocol: list(rtsp|isapi|onvif|unicast|multicast)
  hikvision_2_rtsp_transport: list(tcp|udp|auto)
  hikvision_2_rtsp_main: str?
  hikvision_2_rtsp_sub: str?
  hikvision_2_onvif_url: str?
  hikvision_2_isapi_base_url: str?
  hikvision_2_record: bool
  hikvision_2_low_latency: bool
  hikvision_2_snapshot_stream: list(sub|main)
  hikvision_2_live_stream: list(sub|main)
  hikvision_2_record_stream: list(main|sub)
backup: hot
backup_exclude:
  - /media/edge-of-infinity/recordings

