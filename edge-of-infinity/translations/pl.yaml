configuration:
  edge_rtc_rtsp_port:
    name: Port wspólnego RTSP EdgeRTC
    description: Wewnętrzne źródło dla nagrywarki i integracji. Po zmianie portu zrestartuj aplikację.
  edge_rtc_api_port:
    name: Port prywatnego API EdgeRTC
    description: Uwierzytelnione wewnętrzne API Live/DVR. Po zmianie portu zrestartuj aplikację.
  log_level:
    name: Poziom logow
    description: Okresla ile informacji Edge Core zapisuje w logach aplikacji.
  api_port:
    name: Port API
    description: Wewnetrzny port uzywany przez Edge Core i Ingress.
  recordings_dir:
    name: Katalog nagran
    description: Katalog, w ktorym Edge zapisuje segmenty nagran.
  database_path:
    name: Sciezka bazy danych
    description: Sciezka do bazy danych Edge Core.
  retention_days:
    name: Dni retencji
    description: Liczba dni przechowywania nagran.
  install_custom_component:
    name: Instaluj custom component
    description: Automatycznie instaluj lub aktualizuj /homeassistant/custom_components/edge przy starcie aplikacji.
  hikvision_1_enabled:
    name: Kamera 1 wlaczona
    description: Wlacza pierwsza kamere Hikvision w Edge.
  hikvision_1_name:
    name: Kamera 1 nazwa
    description: Nazwa pierwszej kamery widoczna w Edge i Home Assistant.
  hikvision_1_host:
    name: Kamera 1 adres IP
    description: Adres IP pierwszej kamery Hikvision.
  hikvision_1_username:
    name: Kamera 1 login
    description: Login do pierwszej kamery.
  hikvision_1_password:
    name: Kamera 1 haslo
    description: Haslo do pierwszej kamery.
  hikvision_1_rtsp_main:
    name: Kamera 1 RTSP main
    description: Opcjonalny glowny RTSP. Gdy puste, Edge zbuduje standardowa sciezke Hikvision 101.
  hikvision_1_rtsp_sub:
    name: Kamera 1 RTSP sub
    description: Opcjonalny pomocniczy RTSP. Gdy puste, Edge zbuduje standardowa sciezke Hikvision 102.
  hikvision_1_onvif_url:
    name: Kamera 1 ONVIF URL
    description: Opcjonalny URL ONVIF pierwszej kamery.
  hikvision_1_isapi_base_url:
    name: Kamera 1 ISAPI URL
    description: Opcjonalny bazowy URL ISAPI pierwszej kamery.
  hikvision_1_record:
    name: Kamera 1 nagrywanie
    description: Oznacza pierwsza kamere jako gotowa do nagrywania.
  hikvision_1_low_latency:
    name: Kamera 1 low latency
    description: Preferuje tryb niskich opoznien dla pierwszej kamery.
  hikvision_1_snapshot_stream:
    name: Kamera 1 snapshot stream
    description: Wybiera strumien dla snapshotu, sub lub main.
  hikvision_1_record_stream:
    name: Kamera 1 stream nagrywania
    description: Wybiera czy NVR nagrywa main czy sub.
  hikvision_2_enabled:
    name: Kamera 2 wlaczona
    description: Wlacza druga kamere Hikvision w Edge.
  hikvision_2_name:
    name: Kamera 2 nazwa
    description: Nazwa drugiej kamery widoczna w Edge i Home Assistant.
  hikvision_2_host:
    name: Kamera 2 adres IP
    description: Adres IP drugiej kamery Hikvision.
  hikvision_2_username:
    name: Kamera 2 login
    description: Login do drugiej kamery.
  hikvision_2_password:
    name: Kamera 2 haslo
    description: Haslo do drugiej kamery.
  hikvision_2_rtsp_main:
    name: Kamera 2 RTSP main
    description: Opcjonalny glowny RTSP. Gdy puste, Edge zbuduje standardowa sciezke Hikvision 101.
  hikvision_2_rtsp_sub:
    name: Kamera 2 RTSP sub
    description: Opcjonalny pomocniczy RTSP. Gdy puste, Edge zbuduje standardowa sciezke Hikvision 102.
  hikvision_2_onvif_url:
    name: Kamera 2 ONVIF URL
    description: Opcjonalny URL ONVIF drugiej kamery.
  hikvision_2_isapi_base_url:
    name: Kamera 2 ISAPI URL
    description: Opcjonalny bazowy URL ISAPI drugiej kamery.
  hikvision_2_record:
    name: Kamera 2 nagrywanie
    description: Oznacza druga kamere jako gotowa do nagrywania.
  hikvision_2_low_latency:
    name: Kamera 2 low latency
    description: Preferuje tryb niskich opoznien dla drugiej kamery.
  hikvision_2_snapshot_stream:
    name: Kamera 2 snapshot stream
    description: Wybiera strumien dla snapshotu, sub lub main.
  hikvision_2_record_stream:
    name: Kamera 2 stream nagrywania
    description: Wybiera czy NVR nagrywa main czy sub.
  cameras:
    name: Kamery
    description: Opcjonalna lista kamer w YAML. Kamery zwykle dodaje się w panelu Edge; ta lista tworzy tylko pierwszą konfigurację.
  sync_addon_options:
    name: Synchronizacja opcji dodatku (starsza)
    description: Zachowane dla starszych instalacji. Kamery zapisane w panelu Edge zawsze mają pierwszeństwo; opcje dodatku tworzą tylko pierwszą konfigurację.
  camera_events_enabled:
    name: Zdarzenia z kamery
    description: Odbiera zdarzenia ruchu i analityki zgłaszane przez samą kamerę (ONVIF lub API producenta).
  local_detection_enabled:
    name: Lokalna detekcja
    description: Wykrywa osoby, zwierzęta i pojazdy na tym urządzeniu ze wspólnego strumienia kamery.
  detection_fps:
    name: Analizowane klatki na sekundę
    description: Łączna liczba analizowanych klatek na sekundę dla wszystkich kamer, 0,2–3. Na słabszym sprzęcie zacznij od 1.
  detection_decoder:
    name: Dekoder detekcji
    description: auto wybiera dostępną akcelerację, cpu dekoduje programowo, keyframes analizuje tylko klatki kluczowe.
  detection_confidence:
    name: Pewność detekcji
    description: Minimalna pewność dla osób i pojazdów, 0,1–0,95. Wyższa wartość oznacza mniej fałszywych alarmów.
  detection_animal_confidence:
    name: Pewność detekcji zwierząt
    description: Minimalna pewność dla zwierząt, 0,1–0,95.
  detection_hold_seconds:
    name: Czas podtrzymania detekcji
    description: Liczba sekund, przez które czujnik pozostaje włączony po ostatnim wykryciu, 1–120.
  detection_person_enabled:
    name: Wykrywaj osoby
    description: Tworzy zdarzenia dla wykrytych osób.
  detection_animal_enabled:
    name: Wykrywaj zwierzęta
    description: Tworzy zdarzenia dla wykrytych zwierząt.
  detection_vehicle_enabled:
    name: Wykrywaj pojazdy
    description: Tworzy zdarzenia dla wykrytych pojazdów.
  detection_alert_media_mb:
    name: Miejsce na klipy alertów
    description: Limit miejsca na klipy alertów w MiB, 32–4096. Najstarsze klipy są usuwane jako pierwsze.
  detection_pre_seconds:
    name: Sekundy przed zdarzeniem
    description: Długość nagrania sprzed zdarzenia w klipie alertu, 0–10.
  detection_post_seconds:
    name: Sekundy po zdarzeniu
    description: Długość nagrania po zdarzeniu w klipie alertu, 5–60.
  detection_notifications_enabled:
    name: Powiadomienia na telefon
    description: Wysyła powiadomienie ze zdjęciem po wykryciu osoby lub zwierzęcia.
  detection_notify_service:
    name: Usługa powiadomień
    description: Usługa aplikacji Home Assistant Companion, np. notify.mobile_app_twoj_telefon.
  detection_notify_cooldown:
    name: Przerwa między powiadomieniami
    description: Minimalna liczba sekund między powiadomieniami z jednej kamery, 5–3600.
  detection_notify_path:
    name: Odnośnik w powiadomieniu
    description: Ścieżka dashboardu otwierana po dotknięciu powiadomienia, np. /lovelace/kamery. Puste pole oznacza brak odnośnika.
  hikvision_1_camera_number:
    name: Kamera 1 numer kanału
    description: Numer kanału w kamerze lub rejestratorze, używany do zbudowania adresu RTSP.
  hikvision_1_access_protocol:
    name: Kamera 1 protokół dostępu
    description: "Sposób łączenia z kamerą: rtsp, isapi, onvif, unicast lub multicast."
  hikvision_1_rtsp_transport:
    name: Kamera 1 transport RTSP
    description: tcp jest najbardziej niezawodny; udp lub auto tylko, gdy wymaga tego kamera.
  hikvision_1_live_stream:
    name: Kamera 1 strumień podglądu
    description: Wybiera strumień podglądu na żywo, sub lub main.
  hikvision_2_camera_number:
    name: Kamera 2 numer kanału
    description: Numer kanału w kamerze lub rejestratorze, używany do zbudowania adresu RTSP.
  hikvision_2_access_protocol:
    name: Kamera 2 protokół dostępu
    description: "Sposób łączenia z kamerą: rtsp, isapi, onvif, unicast lub multicast."
  hikvision_2_rtsp_transport:
    name: Kamera 2 transport RTSP
    description: tcp jest najbardziej niezawodny; udp lub auto tylko, gdy wymaga tego kamera.
  hikvision_2_live_stream:
    name: Kamera 2 strumień podglądu
    description: Wybiera strumień podglądu na żywo, sub lub main.
network:
  8088/TCP: API Edge Core i interfejs webowy
  "8443/TCP": "Opcjonalna lokalna brama HTTPS dla Home Assistant; najpierw ją włącz i zaufaj certyfikatowi"
  "8556/TCP": "Wspólny strumień RTSP rdzenia; pozostaw wyłączony, chyba że musi go czytać inne urządzenie"
  "9997/TCP": "Prywatne API rdzenia strumieniowania; pozostaw wyłączone"
