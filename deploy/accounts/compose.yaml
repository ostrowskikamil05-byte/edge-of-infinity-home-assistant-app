name: edge-accounts
services:
  postgres:
    image: postgres:17.10-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${EDGE_DB_PASSWORD:?Run prepare.py first}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
  identity:
    image: ghcr.io/zitadel/zitadel:v4.20.2
    restart: unless-stopped
    command: [start-from-init, --masterkeyFromEnv, --tlsMode, external]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ZITADEL_MASTERKEY: ${EDGE_MASTER_KEY:?Run prepare.py first}
      ZITADEL_EXTERNALDOMAIN: ${EDGE_ACCOUNT_DOMAIN:?Set the real account domain}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: "true"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:${EDGE_DB_PASSWORD:?Set database password}@postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_NAME: Edge of Infinity
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: ${EDGE_ADMIN_EMAIL:?Set operator email}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: ${EDGE_ADMIN_EMAIL:?Set operator email}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: ${EDGE_ADMIN_PASSWORD:?Run prepare.py first}
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "true"
      ZITADEL_DEFAULTINSTANCE_INSTANCENAME: Edge of Infinity
      ZITADEL_DEFAULTINSTANCE_DEFAULTLANGUAGE: pl
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: "false"
      ZITADEL_DEFAULTINSTANCE_PASSWORDCOMPLEXITYPOLICY_MINLENGTH: 12
      ZITADEL_DEFAULTINSTANCE_LOGINPOLICY_ALLOWREGISTER: "true"
      ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXPASSWORDATTEMPTS: 10
      ZITADEL_DEFAULTINSTANCE_LOCKOUTPOLICY_MAXOTPATTEMPTS: 5
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_ACCESSTOKENLIFETIME: 15m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_IDTOKENLIFETIME: 15m
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENIDLEEXPIRATION: 720h
      ZITADEL_DEFAULTINSTANCE_OIDCSETTINGS_REFRESHTOKENEXPIRATION: 720h
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_HOST: ${EDGE_SMTP_HOST:?Set SMTP host and port}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_USER: ${EDGE_SMTP_USER:?Set SMTP username}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_SMTP_PASSWORD: ${EDGE_SMTP_PASSWORD:?Set SMTP credential privately in .env}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_TLS: "true"
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROM: ${EDGE_VERIFICATION_EMAIL:?Set verification sender}
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_FROMNAME: Edge of Infinity
      ZITADEL_DEFAULTINSTANCE_SMTPCONFIGURATION_REPLYTOADDRESS: ${EDGE_SUPPORT_EMAIL:?Set support mailbox}
      ZITADEL_DEFAULTINSTANCE_PRIVACYPOLICY_SUPPORTEMAIL: ${EDGE_SUPPORT_EMAIL:?Set support mailbox}
      ZITADEL_DEFAULTINSTANCE_DOMAINPOLICY_SMTPSENDERADDRESSMATCHESINSTANCEDOMAIN: "false"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "false"
    healthcheck:
      test: [CMD, /app/zitadel, ready]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 30s
    networks: [private, edge]
  gateway:
    image: traefik:v3.7.18
    restart: unless-stopped
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.websecure.address=:443
      - --providers.file.filename=/etc/traefik/accounts.yaml
      - --certificatesresolvers.edge.acme.email=${EDGE_ADMIN_EMAIL:?Set operator email}
      - --certificatesresolvers.edge.acme.storage=/certificates/acme.json
      - --certificatesresolvers.edge.acme.httpchallenge.entrypoint=web
      - --api.dashboard=false
      - --accesslog=false
      - --log.level=WARN
    environment:
      EDGE_ACCOUNT_DOMAIN: ${EDGE_ACCOUNT_DOMAIN:?Set the real account domain}
    ports: ["80:80", "443:443"]
    volumes:
      - ./gateway.yaml:/etc/traefik/accounts.yaml:ro
      - certificates:/certificates
    networks: [edge]
networks:
  private:
    internal: true
  edge:
volumes:
  database:
  certificates:
